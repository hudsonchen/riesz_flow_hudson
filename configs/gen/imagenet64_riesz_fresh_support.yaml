logging:
  use_wandb: false
  log_every_k: 10

dataset:
  resolution: 64
  use_aug: false
  use_latent: true
  use_cache: false
  num_classes: 1000
  eval_split: train
  batch_size: 256
  eval_batch_size: 64
  kwargs:
    num_workers: 8
    pin_memory: true
    prefetch_factor: 2

model:
  cond_dim: 384
  input_size: 8
  in_channels: 4
  patch_size: 1
  hidden_size: 384
  depth: 9
  num_heads: 6
  mlp_ratio: 4.0
  out_channels: 4
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 8
  noise_classes: 64
  noise_coords: 8
  use_bf16: true
  use_remat: false
  attn_fp32: true

optimizer:
  lr_schedule:
    learning_rate: 0.0002
    warmup_steps: 5000
    lr_schedule: "const"
    total_steps: 150000
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95

train:
  diverse_noise: true
  train_batch_size: 16
  seed: 42
  total_steps: 150000
  save_per_step: 5000
  keep_last: null
  keep_every: null
  eval_per_step: 500
  eval_samples: 5000
  sanity_samples: 64
  eval_fid: false
  eval_isc: false
  eval_prc_recall: false
  pos_per_sample: 64
  neg_per_sample: 32
  positive_bank_size: 128
  negative_bank_size: 1000
  forward_dict:
    gen_per_label: 64
    cfg_min: 1.0
    cfg_max: 4.0
    neg_cfg_pw: 3.0
  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    every_k_block: 2
  loss_kwargs:
    R_list: [0.05]
  cfg_list: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5]
  ema_decay: 0.999
  push_per_step: 256
  # On checkpoint resume, perform one ordinary memory-bank refill. Leaving
  # this unset inherits 3000 and stalls while every rank VAE-encodes 768K images.
  push_at_resume: 1
  grad_accum_steps: 1
  max_grad_norm: 2.0

  ot_mode: "none"
  use_riesz: true
  riesz_kwargs:
    epsilon: 1.0e-6
    # Draw an independent current-generator support batch every optimizer step.
    # The support generation and MAE feature pass are detached and not retained.
    self_support_mode: "fresh"

feature:
  mae_path: "hf://mae_latent_256"
  use_mae: true
  use_convnext: false
