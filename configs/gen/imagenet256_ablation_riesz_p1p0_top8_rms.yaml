logging:
  use_wandb: false
  log_every_k: 10

dataset:
  resolution: 256
  use_aug: false
  use_latent: true
  use_cache: true
  num_classes: 1000
  batch_size: 1024
  eval_batch_size: 2048
  kwargs:
    num_workers: 8
    pin_memory: true
    prefetch_factor: 2

model:
  cond_dim: 768
  input_size: 32
  in_channels: 4
  patch_size: 2
  hidden_size: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  out_channels: 4
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 16
  noise_classes: 64
  noise_coords: 32
  use_bf16: true
  attn_fp32: true

optimizer:
  lr_schedule:
    learning_rate: 0.0002
    warmup_steps: 5000
    lr_schedule: "const"
    total_steps: 30000
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95

train:
  diverse_noise: true
  train_batch_size: 64
  seed: 42
  total_steps: 30000
  save_per_step: 2000
  keep_every: 10000
  eval_per_step: 5000
  # Keep in-training evaluation to lightweight previews. Run FID-50K with the
  # separate checkpoint evaluator after training.
  eval_samples: 64
  preview_samples: 24
  eval_fid: false
  eval_isc: false
  eval_prc_recall: false

  pos_per_sample: 64
  neg_per_sample: 16
  positive_bank_size: 128
  negative_bank_size: 1000
  push_per_step: 64
  push_at_resume: 1
  grad_accum_steps: 4
  max_grad_norm: 2.0

  forward_dict:
    gen_per_label: 64
    cfg_min: 1.0
    cfg_max: 4.0
    neg_cfg_pw: 3.0

  activation_kwargs:
    patch_mean_size: [2, 4]
    patch_std_size: [2, 4]
    use_std: true
    use_mean: true
    every_k_block: 2

  loss_kwargs:
    R_list: [0.2, 0.05, 0.02]
  cfg_list: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5]
  ema_decay: 0.999

  # Controlled objective ablation: p=1 Riesz top-k field with a detached
  # (frozen) one-step target, normalized to unit RMS.
  ot_mode: "none"
  use_riesz: true
  riesz_kwargs:
    epsilon: 1.0e-6
    use_rms: true
    topk: 8

feature:
  mae_path: "hf://mae_latent_256"
  use_mae: true
  use_convnext: false
